name: Nightly build (now.md and indexes)

# Nightly snapshot of what is in motion, plus the cross-reference indexes, for every client to load.
#
# This is the only automated write to main the wiki expects. It is safe to leave unattended because:
#   - both outputs are generated, never handwritten: bin/build-indexes.py and bin/build-now.py derive
#     them from frontmatter and unchecked boxes, with no AI and no judgment. Same repo in, same files
#     out.
#   - the scope is enforced here, not trusted: the job fails rather than commit if the build touched
#     any path other than now.md and indexes/*.md.
#   - it runs in the middle of the night (adjust the cron to your time zone) and only commits when
#     the body changed. A quiet night writes nothing.
#
# It does not run in the public scaffold itself, which ships empty; see the `if:` below. In your own
# private copy it runs as is. If main is branch-protected, allow GitHub Actions to push to it, or
# the push step will be rejected.

on:
  schedule:
    - cron: '23 7 * * *'   # 07:23 UTC = 3:23am US Eastern (daylight time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-now
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'mikecirrotti/engram-wiki'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build, commit and push
        run: |
          git config user.name  "engram-now[bot]"
          git config user.email "engram-now@users.noreply.github.com"

          # Up to three tries: if main moves between checkout and push, start over from the new tip
          # rather than merging. The bot never resolves anything; it just rebuilds.
          for attempt in 1 2 3; do
            python3 bin/build-indexes.py
            python3 bin/build-now.py

            changed=$(git status --porcelain)
            if [ -z "$changed" ]; then
              echo "No change to now.md or indexes/. Nothing to commit."
              exit 0
            fi

            # The bot covers exactly these paths. Anything else means a script misbehaved.
            others=$(echo "$changed" | awk '{print $NF}' | grep -vxE 'now\.md|indexes/[a-z-]+\.md' || true)
            if [ -n "$others" ]; then
              echo "Refusing to commit: the build touched paths outside now.md and indexes/:"
              echo "$others"
              exit 1
            fi

            git add now.md indexes/
            git commit -q -m "nightly: rebuild now.md and indexes" -m "Generated by bin/build-indexes.py and bin/build-now.py. See .github/workflows/build-now.yml."
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected (main moved). Rebuilding from the new tip."
            git fetch -q origin main
            git reset -q --hard origin/main
          done

          echo "Gave up after three attempts."
          exit 1
